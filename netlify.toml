# Сборка идёт из корня: там лежит package.json со скриптом build, который
# собирает приложение и кладёт результат в dist/. Так не нужна настройка
# «base directory» — она у площадок называется по-разному и легко теряется.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Приложение одностраничное: любой путь должен отдавать index.html,
# иначе обновление страницы внутри отчёта даст 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
