<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="1120" height="630">
  <!--
    Большой сниппет — то, как приложение выглядит, когда ссылку на него
    публикуют в ленте или присылают в сообщении. Пропорции 16:9, поэтому
    композиция вертикальная: обложка каталога (4:1) сюда не растягивается.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2688eb"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.11"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="630" fill="url(#bg)"/>
  <circle cx="960" cy="70" r="240" fill="#ffffff" opacity="0.1"/>
  <circle cx="1080" cy="580" r="170" fill="#ffffff" opacity="0.08"/>

  <text x="80" y="150" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    Что мешает
  </text>
  <text x="80" y="226" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    странице расти
  </text>
  <text x="80" y="290" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30" fill="#ffffff" opacity="0.88">
    Разбор сообщества ВКонтакте за минуту
  </text>

  <!-- карточки цифр — как в самом отчёте -->
  <g transform="translate(80, 350)">
    <rect width="228" height="96" rx="20" fill="url(#card)"/>
    <text x="24" y="40" font-family="-apple-system, sans-serif" font-size="21"
          fill="#ffffff" opacity="0.8">Зон роста</text>
    <text x="24" y="76" font-family="-apple-system, sans-serif" font-size="32"
          font-weight="700" fill="#ffffff">14</text>

    <rect x="252" width="228" height="96" rx="20" fill="url(#card)"/>
    <text x="276" y="40" font-family="-apple-system, sans-serif" font-size="21"
          fill="#ffffff" opacity="0.8">План</text>
    <text x="276" y="76" font-family="-apple-system, sans-serif" font-size="32"
          font-weight="700" fill="#ffffff">4 недели</text>
  </g>

  <text x="80" y="530" font-family="-apple-system, sans-serif" font-size="24"
        fill="#ffffff" opacity="0.82">
    Метрики · зоны роста · план · конкуренты
  </text>
  <text x="80" y="576" font-family="-apple-system, sans-serif" font-size="21"
        fill="#ffffff" opacity="0.6">
    Считает по открытым данным, ничего не сохраняет
  </text>

  <!-- график роста -->
  <g transform="translate(700, 300)">
    <rect x="0" y="150" width="76" height="132" rx="20" fill="url(#bar)"/>
    <rect x="108" y="92" width="76" height="190" rx="20" fill="url(#bar)"/>
    <rect x="216" y="24" width="76" height="258" rx="20" fill="url(#bar)"/>
    <path d="M20 118 L128 62 L236 -6 L310 -46" fill="none" stroke="#ffffff"
          stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="310" cy="-46" r="27" fill="#ffffff"/>
    <circle cx="310" cy="-46" r="12" fill="#7c4dff"/>
  </g>
</svg>
