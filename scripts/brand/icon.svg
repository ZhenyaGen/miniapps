<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 576" width="576" height="576">
  <!--
    Иконка приложения: тот же градиент, что на первом экране, и растущий
    график с отметкой найденной точки роста. Без текста — в каталоге иконка
    показывается размером с ноготь, надписи там не читаются, и модерация
    ВКонтакте это отдельно оговаривает.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2688eb"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="576" height="576" rx="128" fill="url(#bg)"/>

  <!-- световое пятно, как на градиентном заголовке в приложении -->
  <circle cx="470" cy="90" r="150" fill="#ffffff" opacity="0.12"/>

  <!-- столбцы: три растущих показателя -->
  <g>
    <rect x="122" y="330" width="72" height="126" rx="20" fill="url(#bar)"/>
    <rect x="228" y="262" width="72" height="194" rx="20" fill="url(#bar)"/>
    <rect x="334" y="182" width="72" height="274" rx="20" fill="url(#bar)"/>
  </g>

  <!-- линия роста с точкой: то, что приложение и ищет -->
  <path d="M140 300 L246 232 L352 152 L436 118"
        fill="none" stroke="#ffffff" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="436" cy="118" r="34" fill="#ffffff"/>
  <circle cx="436" cy="118" r="15" fill="#7c4dff"/>
</svg>
