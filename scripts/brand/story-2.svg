<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Сторис 2 · что показывает разбор: список находок, как в отчёте -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2688eb"/><stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.09"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="960" cy="180" r="300" fill="#ffffff" opacity="0.1"/>

  <text x="90" y="380" font-family="-apple-system, sans-serif" font-size="72"
        font-weight="700" fill="#ffffff" letter-spacing="-2">Нашёл 14 причин,</text>
  <text x="90" y="470" font-family="-apple-system, sans-serif" font-size="72"
        font-weight="700" fill="#ffffff" letter-spacing="-2">почему не растёт</text>

  <g transform="translate(90, 600)">
    <rect width="900" height="150" rx="26" fill="url(#card)"/>
    <circle cx="66" cy="75" r="30" fill="#ff5c5c"/>
    <text x="52" y="89" font-family="-apple-system, sans-serif" font-size="34"
          font-weight="700" fill="#ffffff">1</text>
    <text x="126" y="66" font-family="-apple-system, sans-serif" font-size="40"
          font-weight="600" fill="#ffffff">Страница не дооформлена</text>
    <text x="126" y="114" font-family="-apple-system, sans-serif" font-size="32"
          fill="#ffffff" opacity="0.7">нет описания, статуса, обложки и меню</text>
  </g>

  <g transform="translate(90, 780)">
    <rect width="900" height="150" rx="26" fill="url(#card)"/>
    <circle cx="66" cy="75" r="30" fill="#ff5c5c"/>
    <text x="52" y="89" font-family="-apple-system, sans-serif" font-size="34"
          font-weight="700" fill="#ffffff">2</text>
    <text x="126" y="66" font-family="-apple-system, sans-serif" font-size="40"
          font-weight="600" fill="#ffffff">Публикуете реже, чем нужно</text>
    <text x="126" y="114" font-family="-apple-system, sans-serif" font-size="32"
          fill="#ffffff" opacity="0.7">1,5 поста в неделю при ориентире 3–5</text>
  </g>

  <g transform="translate(90, 960)">
    <rect width="900" height="150" rx="26" fill="url(#card)"/>
    <circle cx="66" cy="75" r="30" fill="#ffb020"/>
    <text x="52" y="89" font-family="-apple-system, sans-serif" font-size="34"
          font-weight="700" fill="#ffffff">3</text>
    <text x="126" y="66" font-family="-apple-system, sans-serif" font-size="40"
          font-weight="600" fill="#ffffff">Посты выходят в слабое время</text>
    <text x="126" y="114" font-family="-apple-system, sans-serif" font-size="32"
          fill="#ffffff" opacity="0.7">лучший слот даёт втрое больше реакций</text>
  </g>

  <text x="90" y="1230" font-family="-apple-system, sans-serif" font-size="38"
        fill="#ffffff" opacity="0.65">…и ещё 11 пунктов</text>

  <g transform="translate(90, 1340)">
    <rect width="900" height="180" rx="28" fill="url(#card)"/>
    <text x="46" y="70" font-family="-apple-system, sans-serif" font-size="40"
          font-weight="600" fill="#ffffff">К каждой находке — что делать</text>
    <text x="46" y="126" font-family="-apple-system, sans-serif" font-size="34"
          fill="#ffffff" opacity="0.7">и план на 4 недели с галочками</text>
  </g>
</svg>
