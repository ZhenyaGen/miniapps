<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 400" width="1590" height="400">
  <!-- Шапка формы общих отзывов -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2688eb"/><stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1590" height="400" fill="url(#bg)"/>
  <circle cx="1330" cy="30" r="250" fill="#ffffff" opacity="0.1"/>
  <circle cx="1500" cy="380" r="160" fill="#ffffff" opacity="0.07"/>

  <text x="90" y="165" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    Отзыв об «Аудите страницы ВК»
  </text>
  <text x="90" y="228" font-family="-apple-system, sans-serif" font-size="32"
        fill="#ffffff" opacity="0.88">
    Пять вопросов, минута времени
  </text>
  <text x="90" y="300" font-family="-apple-system, sans-serif" font-size="28"
        fill="#ffffff" opacity="0.66">
    Критика полезнее похвалы — пишите как есть
  </text>

  <g transform="translate(1180, 128)" opacity="0.95">
    <rect x="0" y="118" width="52" height="92" rx="14" fill="url(#bar)"/>
    <rect x="74" y="78" width="52" height="132" rx="14" fill="url(#bar)"/>
    <rect x="148" y="34" width="52" height="176" rx="14" fill="url(#bar)"/>
    <path d="M14 104 L88 64 L162 20 L224 -2" fill="none" stroke="#ffffff"
          stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="224" cy="-2" r="19" fill="#ffffff"/>
    <circle cx="224" cy="-2" r="8" fill="#7c4dff"/>
  </g>
</svg>
