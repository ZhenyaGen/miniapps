<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 400" width="1590" height="400">
  <!--
    Обложка карточки в каталоге. Тот же градиент, что у иконки и первого
    экрана приложения, — карточка и приложение читаются как одно целое.
    Текста немного и он крупный: баннер часто показывают уменьшенным.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2688eb"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1590" height="400" fill="url(#bg)"/>
  <circle cx="1290" cy="40" r="260" fill="#ffffff" opacity="0.1"/>
  <circle cx="1480" cy="360" r="180" fill="#ffffff" opacity="0.08"/>

  <text x="90" y="175" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Что мешает странице расти
  </text>
  <text x="90" y="243" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="400" fill="#ffffff" opacity="0.88">
    Метрики, зоны роста и план на 4 недели
  </text>

  <!-- три карточки цифр — так же, как они выглядят в отчёте -->
  <g transform="translate(90, 285)">
    <rect width="200" height="76" rx="18" fill="url(#card)"/>
    <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="19"
          fill="#ffffff" opacity="0.8">Вовлечённость</text>
    <text x="20" y="62" font-family="-apple-system, sans-serif" font-size="26"
          font-weight="700" fill="#ffffff">1,44%</text>

    <rect x="220" width="200" height="76" rx="18" fill="url(#card)"/>
    <text x="240" y="34" font-family="-apple-system, sans-serif" font-size="19"
          fill="#ffffff" opacity="0.8">Зон роста</text>
    <text x="240" y="62" font-family="-apple-system, sans-serif" font-size="26"
          font-weight="700" fill="#ffffff">14</text>

    <rect x="440" width="200" height="76" rx="18" fill="url(#card)"/>
    <text x="460" y="34" font-family="-apple-system, sans-serif" font-size="19"
          fill="#ffffff" opacity="0.8">План</text>
    <text x="460" y="62" font-family="-apple-system, sans-serif" font-size="26"
          font-weight="700" fill="#ffffff">4 недели</text>
  </g>

  <!-- график роста справа -->
  <g transform="translate(1150, 112)" opacity="0.96">
    <rect x="0" y="128" width="54" height="96" rx="15" fill="#ffffff" opacity="0.45"/>
    <rect x="78" y="86" width="54" height="138" rx="15" fill="#ffffff" opacity="0.6"/>
    <rect x="156" y="40" width="54" height="184" rx="15" fill="#ffffff" opacity="0.75"/>
    <path d="M14 112 L92 70 L170 24 L234 2" fill="none" stroke="#ffffff"
          stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="234" cy="2" r="20" fill="#ffffff"/>
    <circle cx="234" cy="2" r="9" fill="#7c4dff"/>
  </g>
</svg>
