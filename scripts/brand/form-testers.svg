<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 400" width="1590" height="400">
  <!-- Шапка формы для тестировщиков: отличается акцентом, чтобы формы
       не путались между собой в списке -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c4dff"/><stop offset="100%" stop-color="#00b3a4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="1590" height="400" fill="url(#bg)"/>
  <circle cx="1350" cy="40" r="240" fill="#ffffff" opacity="0.1"/>
  <circle cx="1180" cy="390" r="150" fill="#ffffff" opacity="0.07"/>

  <text x="90" y="150" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    Тестирование приложения
  </text>
  <text x="90" y="212" font-family="-apple-system, sans-serif" font-size="32"
        fill="#ffffff" opacity="0.9">
    Спасибо, что согласились помочь
  </text>

  <g transform="translate(90, 262)">
    <rect width="270" height="80" rx="20" fill="url(#card)"/>
    <text x="26" y="50" font-family="-apple-system, sans-serif" font-size="28"
          fill="#ffffff">6 коротких блоков</text>

    <rect x="294" width="230" height="80" rx="20" fill="url(#card)"/>
    <text x="320" y="50" font-family="-apple-system, sans-serif" font-size="28"
          fill="#ffffff">5 минут</text>

    <rect x="548" width="330" height="80" rx="20" fill="url(#card)"/>
    <text x="574" y="50" font-family="-apple-system, sans-serif" font-size="28"
          fill="#ffffff">Ругайте смело</text>
  </g>
</svg>
