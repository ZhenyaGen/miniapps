<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Сторис 3 · призыв: ищу тестировщиков -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2688eb"/><stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="880" cy="1700" r="320" fill="#ffffff" opacity="0.09"/>

  <g transform="translate(400, 260)">
    <rect x="0" y="150" width="80" height="140" rx="22" fill="url(#bar)"/>
    <rect x="110" y="86" width="80" height="204" rx="22" fill="url(#bar)"/>
    <rect x="220" y="20" width="80" height="270" rx="22" fill="url(#bar)"/>
    <path d="M22 118 L132 56 L242 -10 L300 -46" fill="none" stroke="#ffffff"
          stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="300" cy="-46" r="28" fill="#ffffff"/>
    <circle cx="300" cy="-46" r="12" fill="#7c4dff"/>
  </g>

  <text x="90" y="760" font-family="-apple-system, sans-serif" font-size="76"
        font-weight="700" fill="#ffffff" letter-spacing="-2">Ищу 10 человек</text>
  <text x="90" y="856" font-family="-apple-system, sans-serif" font-size="76"
        font-weight="700" fill="#ffffff" letter-spacing="-2">протестировать</text>

  <text x="90" y="960" font-family="-apple-system, sans-serif" font-size="42"
        fill="#ffffff" opacity="0.86">Сделал мини-приложение: разбирает</text>
  <text x="90" y="1016" font-family="-apple-system, sans-serif" font-size="42"
        fill="#ffffff" opacity="0.86">сообщество ВК и показывает, что чинить</text>

  <g transform="translate(90, 1120)">
    <rect width="900" height="110" rx="24" fill="url(#card)"/>
    <text x="46" y="68" font-family="-apple-system, sans-serif" font-size="40"
          fill="#ffffff">Бесплатно и без ограничений</text>
  </g>
  <g transform="translate(90, 1250)">
    <rect width="900" height="110" rx="24" fill="url(#card)"/>
    <text x="46" y="68" font-family="-apple-system, sans-serif" font-size="40"
          fill="#ffffff">Нужен ваш честный отзыв</text>
  </g>
  <g transform="translate(90, 1380)">
    <rect width="900" height="110" rx="24" fill="url(#card)"/>
    <text x="46" y="68" font-family="-apple-system, sans-serif" font-size="40"
          fill="#ffffff">Займёт 10 минут</text>
  </g>

  <text x="90" y="1620" font-family="-apple-system, sans-serif" font-size="46"
        font-weight="600" fill="#ffffff">Пишите «хочу» в личные сообщения</text>
</svg>
